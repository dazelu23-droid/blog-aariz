{% extends "base.html" %}
{% block title %}Log in — Blog Aariz{% endblock %}
{% block content %}
  <div class="form-card" id="login-form-card">
    <h1>Log in</h1>
    {% if errors %}
      <ul class="form-errors" id="form-errors">
        {% for error in errors %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    <form method="post" action="{{ url_for('auth.login') }}" class="auth-form" id="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="login-submit">Log in</button>
    </form>
    <p class="form-hint">Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
  </div>
{% endblock %}
