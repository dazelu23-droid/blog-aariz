{% extends "base.html" %}
{% block title %}{% if post %}Edit{% else %}New{% endif %} Post — Blog Aariz{% endblock %}
{% block content %}
  <div class="form-card" id="edit-form-card">
    <h1>{% if post %}Edit Post{% else %}New Post{% endif %}</h1>
    {% if errors %}
      <ul class="form-errors" id="form-errors">
        {% for error in errors %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    <form method="post" action="{% if post %}{{ url_for('posts.edit_post', post_id=post.id) }}{% else %}{{ url_for('posts.new_post') }}{% endif %}" class="post-form" id="post-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ title or (post.title if post else '') }}" maxlength="200" required>
      </div>
      <div class="form-group">
        <label for="body">Body</label>
        <textarea id="body" name="body" rows="12" maxlength="20000" required>{{ body or (post.body if post else '') }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary" id="post-submit">{% if post %}Save changes{% else %}Publish{% endif %}</button>
    </form>
  </div>
{% endblock %}
