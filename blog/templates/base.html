<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Blog Aariz{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a href="{{ url_for('posts.index') }}" class="logo">Blog Aariz</a>
      <nav class="nav" aria-label="Main navigation">
        <a href="{{ url_for('posts.index') }}" class="nav-link">Home</a>
        <a href="{{ url_for('search.search') }}" class="nav-link">Search</a>
        {% if current_user %}
          <a href="{{ url_for('posts.new') }}" class="nav-link">New Post</a>
          <span class="nav-user">{{ current_user.username }}</span>
          <form action="{{ url_for('auth.logout') }}" method="post" class="logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-ghost" id="logout-btn">Log out</button>
          </form>
        {% else %}
          <a href="{{ url_for('auth.login') }}" class="nav-link">Log in</a>
          <a href="{{ url_for('auth.signup') }}" class="btn btn-primary">Sign up</a>
        {% endif %}
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <span class="theme-icon" id="theme-icon">🌙</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Blog Aariz</p>
    </div>
  </footer>
</body>
</html>
